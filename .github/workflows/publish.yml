# Publish the Apache-2.0 libraries to npm, from a release tag.
#
# # Why pack with pnpm and publish with npm
#
# These packages depend on each other through `workspace:*`, which is a pnpm instruction and not a
# version range. `npm publish` does not rewrite it: it would put `"@projectx-social/sdk":
# "workspace:*"` into the published manifest, and every install of the four dependent packages
# would fail to resolve. `pnpm pack` writes the publish manifest properly — verified by unpacking
# the signer tarball, whose dependencies read `1.0.0` — and `npm publish <tarball> --provenance`
# then attaches the attestation that pnpm 9 cannot.
#
# # The token, and why it is temporary
#
# npm configures trusted publishing inside a package's own settings, which do not exist until the
# package has been published once. So the first release authenticates with a granular token held
# as a repository secret; every release after it should use trusted publishing, and this file
# should lose the token when that is configured. The provenance attestation is produced either
# way, from this workflow's GitHub identity.
#
# All six libraries are published. `@projectx-social/daemon` was dropped from an earlier release
# because it declared no entry points and would have shipped an empty shell — a defect in its
# manifest, never in its code, which was complete and tested throughout. It now declares `exports`,
# `types`, three `bin` commands and a `files` list, and emits declarations like every other package.
#
# Dropping it was also not a call to make alone: the licence ruling named six libraries, and a
# package that cannot ship as ruled is a decision to bring back, not one to take.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Pack, in dependency order
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          for p in sdk policy signer agent mcp daemon; do
            (cd "packages/$p" && pnpm pack --pack-destination /tmp/tarballs)
          done
          ls -la /tmp/tarballs
      - name: Refuse any tarball still carrying a workspace link
        # The one failure this whole file exists to prevent, checked rather than trusted.
        run: |
          set -euo pipefail
          for t in /tmp/tarballs/*.tgz; do
            if tar -xzOf "$t" package/package.json | grep -q '"workspace:'; then
              echo "REFUSED: $t still contains a workspace: dependency"
              exit 1
            fi
          done
          echo "no workspace links in any tarball"
      - name: Publish, in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.KAELASECRET }}
        run: |
          set -euo pipefail
          for p in sdk policy signer agent mcp daemon; do
            f=$(ls /tmp/tarballs/projectx-social-$p-*.tgz)
            echo "== publishing $f"
            npm publish "$f" --provenance --access public
          done
